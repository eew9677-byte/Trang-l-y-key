<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Lấy Key NK VIP</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0a0c14;
            --card-bg: rgba(18, 22, 36, 0.95);
            --cyan: #00f3ff;
            --pink: #ff0055;
            --yellow: #ffe600;
            --green: #00ff66;
            --text: #e0e6ed;
        }

        * {
            box-sizing: border-box;
            margin: 0; padding: 0;
            font-family: 'Rajdhani', sans-serif;
            user-select: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }

        .box-container {
            width: 100%;
            max-width: 380px;
            background: var(--card-bg);
            border: 1px solid var(--pink);
            box-shadow: 0 0 20px rgba(255, 0, 85, 0.2);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
        }

        h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 20px;
            color: var(--pink);
            margin-bottom: 8px;
        }

        p { font-size: 13px; color: #aaa; margin-bottom: 20px; }

        .key-display {
            background: rgba(0, 0, 0, 0.6);
            border: 2px dashed var(--cyan);
            color: var(--yellow);
            font-family: 'Orbitron', sans-serif;
            font-size: 22px;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 10px;
            letter-spacing: 2px;
            word-break: break-all;
        }

        .time-badge {
            font-size: 12px;
            color: var(--green);
            margin-bottom: 15px;
            font-weight: bold;
        }

        .btn-copy {
            width: 100%;
            padding: 12px;
            background: var(--green);
            color: #000;
            border: none;
            border-radius: 6px;
            font-family: 'Orbitron', sans-serif;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
        }

        .banned-box {
            display: none;
            border: 1px solid var(--pink);
            background: rgba(255, 0, 85, 0.1);
            padding: 15px;
            border-radius: 8px;
        }

        .banned-box h2 {
            font-family: 'Orbitron', sans-serif;
            color: var(--pink);
            font-size: 16px;
            margin-bottom: 8px;
        }

        .banned-box p {
            color: #ccc;
            font-size: 12px;
            margin-bottom: 15px;
        }

        .btn-relink {
            display: block;
            width: 100%;
            padding: 12px;
            background: var(--pink);
            color: #fff;
            text-decoration: none;
            font-family: 'Orbitron', sans-serif;
            font-size: 12px;
            font-weight: bold;
            border-radius: 6px;
            line-height: 18px;
        }

        .credit {
            margin-top: 15px;
            font-size: 12px;
            color: #777;
        }
    </style>
</head>
<body>

<div class="box-container">
    <h1>🔑 CỔNG LẤY KEY PROXYAIM</h1>
    <p id="sub-title">Sao chép Key bên dưới. Key có hiệu lực trong 1 giờ.</p>

    <div id="valid-session">
        <div class="key-display" id="key-box">nK_******</div>
        <div class="time-badge">⏳ Thời hạn: 1 Giờ (60 Phút)</div>
        <button class="btn-copy" onclick="copyKey()">SAO CHÉP KEY</button>
    </div>

    <div id="banned-session" class="banned-box">
        <h2>🚫 TRUY CẬP BỊ CẤM</h2>
        <p>Phát hiện truy cập lại lần 2 mà không vượt link! Vui lòng thực hiện vượt link rút gọn để nhận Key 1h mới.</p>
        <a href="laykey.html?bypass=true" class="btn-relink" onclick="resetBypass()">VƯỢT LINK LẠI ĐỂ LẤY KEY</a>
    </div>

    <div class="credit">Bản quyền thuộc về @bí ẩn</div>
</div>

<script>
    function processKeyAccess() {
        const urlParams = new URLSearchParams(window.location.search);
        const isBypassed = urlParams.get('bypass') === 'true';
        const hasVisited = sessionStorage.getItem("nk_visited");

        if (hasVisited && !isBypassed) {
            document.getElementById('valid-session').style.display = 'none';
            document.getElementById('sub-title').style.display = 'none';
            document.getElementById('banned-session').style.display = 'block';
            return;
        }

        const randomNum = Math.floor(100000 + Math.random() * 900000);
        const newKey = "nK_" + randomNum;
        
        const expireTime = new Date().getTime() + (60 * 60 * 1000);

        localStorage.setItem("nk_active_key", newKey);
        localStorage.setItem("nk_key_expire", expireTime.toString());

        document.getElementById('key-box').innerText = newKey;
        sessionStorage.setItem("nk_visited", "true");
    }

    function resetBypass() {
        sessionStorage.removeItem("nk_visited");
    }

    function copyKey() {
        const keyText = document.getElementById('key-box').innerText;
        navigator.clipboard.writeText(keyText).then(() => {
            alert("✅ Đã sao chép Key 1h: " + keyText + "\nBây giờ bạn quay lại dán vào Menu để dùng!");
        });
    }

    processKeyAccess();
</script>

</body>
</html>
